name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned npm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Install dependencies
        run: npm ci
      - name: Fail fast if dependencies were not installed
        run: |
          test -x node_modules/.bin/tsc || { echo 'npm ci did not install dependencies'; exit 1; }
          if grep '"resolved": "' package-lock.json | grep -v -E '"resolved": "(https://registry.npmjs.org/|packages/)'; then
            echo 'package-lock.json contains non-public registry URLs'
            exit 1
          fi
      - name: Audit (critical only)
        run: npm audit --audit-level=critical
      - name: Typecheck, lint, documentation and shared MCP configuration
        run: npm run check
      - name: Tests
        run: npm test
      - name: Build extension
        run: ./build.sh
      - name: Verify build output
        run: node scripts/verify-build-output.mjs
      - name: Install Firefox for runtime smoke
        id: firefox
        uses: browser-actions/setup-firefox@v1.7.2
        with:
          firefox-version: '159.0'
      - name: Firefox extension runtime smoke
        timeout-minutes: 5
        env:
          VKAP_FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
        run: npm run smoke:firefox
