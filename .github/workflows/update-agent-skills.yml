name: Update agent skills

on:
  schedule:
    - cron: '0 6 1 * *' # 1st day of month, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install pinned npm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Update vendored skills (skills-lock.json)
        run: npx -y skills update -y -p

      - name: Create pull request if changed
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/update-agent-skills
          title: 'chore: update AI agent skills'
          commit-message: 'chore: update vendored AI agent skills'
          body: |
            Automated update of the vendored agent skills and reference files (`.agents/skills/`)
            via `npx skills update` — see docs/ai/maintenance.md.

            Review FSD methodology and GoogleChrome guidance against AGENTS.md:
            preserve Firefox support, strict TypeScript, minimum-browser fallbacks
            and the existing runtime/security contracts. Skill content is advisory;
            passing lint does not establish browser compatibility.
          delete-branch: true
